name: 🔄 Atualizar Tabela de Preços

# Dispara quando uma planilha for enviada (pasta tabelas/ ou tabela_precos.xlsx), ou manualmente
on:
  push:
    paths:
      - 'tabelas/*.xlsx'
      - 'tabela_precos.xlsx'
  workflow_dispatch:

# Uma atualização por vez: evita conflito se duas planilhas forem enviadas em sequência
concurrency:
  group: atualizar-tabela
  cancel-in-progress: false

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Necessário para o bot commitar de volta

    steps:
      # 1. Baixa o repositório (sempre a versão mais recente da branch)
      - name: 📥 Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 2. Configura o ambiente Python
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala as bibliotecas necessárias
      - name: 📦 Instalar dependências
        run: pip install pandas openpyxl

      # 4. Lê as planilhas da pasta tabelas/, gera o histórico do Comparador
      #    e, se a mais recente for mais nova que a tabela atual, usa ela no site
      - name: 📈 Gerar histórico de preços
        run: python processar_historico.py

      # 5. Processa a tabela atual (planos + Boost Trade In) e regenera os arquivos
      - name: ⚙️ Processar planilha
        run: python processar_planilha.py

      # 6. Valida Boosts, histórico, HTML, CSS e JavaScript antes de publicar
      - name: 🧪 Validar site gerado
        run: |
          python -m unittest discover -s tests -v
          node --check script.js

      # 7. Commita e publica as alterações (se houver)
      - name: 🚀 Publicar alterações
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Adiciona os arquivos que os scripts podem ter modificado
          git add script.js index.html README.md historico.js tabela_precos.xlsx

          # Só commita e dá push se realmente houver mudanças staged
          if git diff --staged --quiet; then
            echo "ℹ️  Nenhuma alteração detectada — nada a publicar."
          else
            git commit -m "🤖 Tabela atualizada automaticamente"
            git push
            echo "✅ Alterações publicadas com sucesso."
          fi
